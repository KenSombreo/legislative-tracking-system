name: production_deployment

# Deploy by pushing a tag, e.g.:
#   git tag v1.0.0-production && git push origin v1.0.0-production
on:
  push:
    tags:
      - v**-production

concurrency:
  group: production_deployment
  cancel-in-progress: false

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    env:
      NAMESPACE: ${{ secrets.DOCKER_HUB_NAMESPACE_PRODUCTION }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME_PRODUCTION }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD_PRODUCTION }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ env.NAMESPACE }}/legislative-tracking-api:latest
            ${{ env.NAMESPACE }}/legislative-tracking-api:${{ env.TAG }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          build-args: |
            API_INTERNAL_URL=http://backend:3001
          tags: |
            ${{ env.NAMESPACE }}/legislative-tracking-web:latest
            ${{ env.NAMESPACE }}/legislative-tracking-web:${{ env.TAG }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - name: Set up SSH key
        run: |
          mkdir -p .ssh
          echo -e "${{ secrets.PRODUCTION_PRIVATE_KEY }}" | tee .ssh/ssh-key > /dev/null
          chmod 400 .ssh/ssh-key

      - name: SSH to Production Server and deploy
        run: |
          ssh -o StrictHostKeyChecking=no -i .ssh/ssh-key ${{ secrets.PRODUCTION_USERNAME }}@${{ secrets.PRODUCTION_HOST }} -p ${{ secrets.PRODUCTION_SSH_PORT }} \
            'cd ${{ secrets.PRODUCTION_PATH }} && \
            echo "${{ secrets.DOCKER_HUB_PASSWORD_PRODUCTION }}" | docker login -u "${{ secrets.DOCKER_HUB_USERNAME_PRODUCTION }}" --password-stdin && \
            IMAGE_NAMESPACE="${{ env.NAMESPACE }}" TAG="${{ env.TAG }}" sh deploy_production.sh'
