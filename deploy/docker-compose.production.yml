# Production stack on the server. Kept on the server in PRODUCTION_PATH (copy it
# there by hand after changing it); started by deploy_production.sh.
#
# Needs next to it:
#   .env           IMAGE_NAMESPACE=<docker hub namespace> (written by deploy_production.sh)
#   backend.env    the API's settings (see backend/.env.example), created by hand once.
#                  Set a strong JWT_SECRET. MongoDB runs on the server itself, so point
#                  DATABASE_URL at the host:
#                  mongodb://<user>:<password>@host.docker.internal:27017/legislative_tracking
#   /mnt/legislative-tracking/storage   uploaded documents (create once: mkdir -p, chown -R 1000:1000)
#
# Ports: frontend 4001, backend 3001 (backend only on the server's localhost).
# Nginx Proxy Manager reaches the site over the shared "proxy" network
# (create once: docker network create proxy, and attach NPM to it).
# In NPM, forward the domain to  legislative-tracking-frontend : 4001.
#
# First admin account (once, after the first deploy):
#   docker exec legislative-tracking-backend node dist/seed.js

name: legislative-tracking

services:
  backend:
    image: ${IMAGE_NAMESPACE}/legislative-tracking-api:${TAG:-latest}
    container_name: legislative-tracking-backend
    restart: unless-stopped
    env_file: backend.env
    environment:
      PORT: "3001"
      FILE_STORAGE_PATH: storage
      # 25 MB, matching the limit shown on the upload screens.
      MAX_FILE_SIZE: "26214400"
    extra_hosts:
      # Lets the container reach MongoDB running on the server.
      - "host.docker.internal:host-gateway"
    ports:
      # Only reachable from the server itself; browsers go through the frontend's /api.
      - "127.0.0.1:3001:3001"
    volumes:
      # Signed ordinances, resolutions, minutes and committee reports, kept on the
      # server so they survive redeploys. The folder must be owned by uid 1000
      # (the container's "node" user).
      - /mnt/legislative-tracking/storage:/app/storage
    networks:
      - default

  frontend:
    image: ${IMAGE_NAMESPACE}/legislative-tracking-web:${TAG:-latest}
    container_name: legislative-tracking-frontend
    restart: unless-stopped
    environment:
      PORT: "4001"
      API_INTERNAL_URL: http://backend:3001
    ports:
      - "4001:4001"
    networks:
      - default
      - proxy
    depends_on:
      - backend

networks:
  default:
  proxy:
    external: true
